[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mylibrary"
dynamic = ["version"]
description = "A simple command-line library management system"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ehsan Ghoreishi" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
mylibrary = "mylibrary.cli:main"

[project.urls]
Repository = "https://github.com/Ehsan-Ghoreishi/library-management-system"

[tool.setuptools]
packages = ["mylibrary"]

[tool.setuptools.dynamic]
version = { attr = "mylibrary.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
